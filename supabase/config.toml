project_id = "leftovr-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "leftovr://auth"
additional_redirect_urls = ["exp://127.0.0.1:8081", "http://localhost:8081"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# SECURITY_REVIEW S10: short OTP lifetime + send throttle (mirror these in the
# hosted project's dashboard before launch — this file only configures local).
otp_expiry = 600
max_frequency = "1m0s"

# Google OAuth (native signInWithIdToken). client_id must list the Web client ID
# first, then the iOS client ID, comma-separated. Secret comes from env.
# skip_nonce_check = true is required: the @react-native-google-signin flow does
# not send a nonce, so Supabase must not enforce one (mirror this in the hosted
# dashboard: Google provider → "Skip nonce check").
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

# Apple Sign-In (native expo-apple-authentication → signInWithIdToken). For the
# native iOS flow the identity token's audience is the app bundle ID, so
# client_id must be the bundle ID. No secret is needed locally for native-only
# verification. skip_nonce_check = true: the native flow sends no nonce.
[auth.external.apple]
enabled = true
client_id = "app.leftovr.mobile"
# Explicit empty secret: native flow needs none. Stops the CLI defaulting to
# env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET) and warning that it's unset.
secret = ""
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55325

[analytics]
enabled = true
port = 55327
backend = "postgres"
