project_id = "leftovr-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "leftovr://auth"
additional_redirect_urls = ["exp://127.0.0.1:8081", "http://localhost:8081"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# SECURITY_REVIEW S10: short OTP lifetime + send throttle (mirror these in the
# hosted project's dashboard before launch — this file only configures local).
otp_expiry = 600
max_frequency = "1m0s"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55325

[analytics]
enabled = true
port = 55327
backend = "postgres"
