project_id = "chomp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "chomp://auth"
additional_redirect_urls = ["exp://127.0.0.1:8081", "http://localhost:8081"]
enable_signup = true

[edge_runtime]
enabled = true
policy = "oneshot"

